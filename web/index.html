<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10221e" />
    <title>Riverside Escape</title>
    <link data-trunk rel="rust" href="../crates/client/Cargo.toml" data-bin="riverside-client" />
    <link data-trunk rel="copy-dir" href="../assets" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #19342e;
      }

      body {
        position: relative;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" tabindex="0"></canvas>
    <script>
      document.addEventListener("contextmenu", (event) => {
        if (event.target.closest("#game-canvas")) event.preventDefault();
      });
    </script>
  </body>
</html>
